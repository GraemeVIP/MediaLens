plugins { id 'com.android.application' }
def signingProperties = new Properties()
def signingPath = System.getenv('MEDIA_LENS_SIGNING_PROPERTIES')
if (signingPath) file(signingPath).withInputStream { signingProperties.load(it) }
android {
    namespace 'io.github.graemevip.medialens'
    compileSdk 36
    defaultConfig {
        applicationId 'io.github.graemevip.medialens'
        minSdk 29
        targetSdk 36
        versionCode 11
        versionName '0.1.0-beta'
        ndk { abiFilters 'arm64-v8a', 'armeabi-v7a', 'x86_64' }
    }
    signingConfigs {
        if (signingPath) release {
            storeFile file(signingProperties['storeFile'])
            storePassword signingProperties['storePassword']
            keyAlias signingProperties['keyAlias']
            keyPassword signingProperties['keyPassword']
        }
    }
    buildTypes {
        release {
            minifyEnabled false
            if (signingPath) signingConfig signingConfigs.release
        }
    }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
    packaging { jniLibs { useLegacyPackaging = true } }
}
dependencies {
    testImplementation "junit:junit:4.13.2"
    implementation 'io.github.junkfood02.youtubedl-android:library:0.18.1'
    implementation 'io.github.junkfood02.youtubedl-android:ffmpeg:0.18.1'
}
